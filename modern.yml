pools:
  default:
    type: voted
    enabled: true
    dynamic: true
    players: 1
    cycle-time: -1
    vote-options: 5
    score:
      persist: true
      default: 0.35
      decay: 0.01
      rise: 0.0015
      min-after-vote: 0.01
      max-after-vote: 0.5
      min-for-vote: 0.03
      after-playing: bound(play_minutes - 30, 0, 60) * -0.01
    cooldown:
      min-length: 45
      minutes-per-day: 15
    modifier: |-
      pow(score, 2) * bound(1 - (0.4 * same_gamemode), 0.4, 1) * bound(0.5 * (
        tanh(
          bound(-0.0025 * players + 0.4, 0.15, 0.6) *
          (mapsize - bound(players * bound(1 - bound(play_minutes - 90, 0, 30) / 200, 0.85, 1) * 1.05, 0, 90))
        ) -
        tanh(
          bound(-0.0025 * players + 0.4, 0.15, 0.6) *
          (mapsize - bound(
            0.005 * (players * bound(1 - bound(play_minutes - 90, 0, 30) / 200, 0.85, 1)) ^ 2 +
            0.95 * (players * bound(1 - bound(play_minutes - 90, 0, 30) / 200, 0.85, 1)) +
            5, 10, 150
          ))
        )
      ), 0, 1)
    maps:
      - Allure
      - Beyond
      - Breezebille
      - Chaos Theory
      - Dizzy
      - Erratic
      - 'FB: Blue Snooze'
      - 'FB: Explorers'
